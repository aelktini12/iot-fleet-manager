spring.application.name=iot-fleet-manager

# --- DATABASE CONFIGURATION ---
# Remplace 'localhost:5432/iot_db' par ton port et le nom de ta base
spring.datasource.url=jdbc:postgresql://localhost:5432/iot_db
spring.datasource.username=postgres
spring.datasource.password=password

# --- JPA / HIBERNATE CONFIGURATION ---
# 'update' permet à Hibernate de créer/modifier les tables automatiquement selon ton code Java
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL dans la console (Indispensable pour débugger au début)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spécifie le dialecte pour que Hibernate parle le "bon" PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Pour voir les valeurs injectées par Hibernate dans la DB
logging.level.org.hibernate.orm.jdbc.bind=TRACE